<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Holographic Card Viewer</title>
  <style>
    /* ========================================
       CSS CUSTOM PROPERTIES
       ======================================== */
    :root {
      /* Holo Color Presets */
      --color1: rgb(0, 231, 255);
      --color2: rgb(255, 0, 231);
      
      /* Dynamic Position Variables */
      --card-rx: 0deg;
      --card-ry: 0deg;
      --card-x: 0px;
      --card-y: 0px;
      
      --gradient-x: 50%;
      --gradient-y: 50%;
      --holo-x: 50%;
      --holo-y: 50%;
      --sparkle-x: 50%;
      --sparkle-y: 50%;
      --light-x: 50%;
      --light-y: 50%;
      
      /* Intensity Variables */
      --foil-opacity: 0.4;
      --foil-brightness: 0.9;
      --foil-contrast: 1.1;
      --glare-opacity: 0.3;
      --sparkle-opacity: 0.15;
      --specular-intensity: 0.5;
      
      /* Edge Glow */
      --edge-glow: 0;
      
      /* Card Dimensions - iPhone focused */
      --card-width: min(90vw, 410px);
    }

    /* ========================================
       RESET & BASE
       ======================================== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #090909;
      color: #fff;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ========================================
       APP CONTAINER
       ======================================== */
    .app {
      width: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 20px) 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      padding-top: max(env(safe-area-inset-top, 0px), 20px);
    }

    /* ========================================
       STATUS
       ======================================== */
    .status {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
      z-index: 100;
      transition: color 0.3s;
    }

    .status.active {
      color: rgba(100, 200, 255, 0.7);
    }

    /* ========================================
       CARD CONTAINER
       The card itself has subtle 3D movement
       ======================================== */
    .card {
      --aspect: 2.5 / 3.5;
      
      width: var(--card-width);
      aspect-ratio: var(--aspect);
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      
      /* Subtle 3D transformation based on sensor */
      transform: 
        perspective(1100px)
        translate3d(var(--card-x), var(--card-y), 0)
        rotateX(var(--card-rx))
        rotateY(var(--card-ry));
      transform-style: preserve-3d;
      
      /* Dynamic shadow based on tilt */
      box-shadow:
        calc(var(--card-x) * -1.2) calc(var(--card-y) * -1.2) 20px -5px rgba(0, 0, 0, 0.6),
        calc(var(--card-x) * 0.5) calc(var(--card-y) * 0.5) 30px -10px rgba(var(--color1), calc(0.08 * var(--edge-glow))),
        calc(var(--card-x) * -0.5) calc(var(--card-y) * -0.5) 30px -10px rgba(var(--color2), calc(0.08 * var(--edge-glow))),
        0 35px 60px -15px rgba(0, 0, 0, 0.7),
        0 50px 80px -20px rgba(0, 0, 0, 0.5);
      
      background: #1a1a1a;
      will-change: transform, box-shadow;
    }

    /* ========================================
       CARD IMAGE
       ======================================== */
    .card__image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: linear-gradient(145deg, #222 0%, #111 100%);
      z-index: 1;
    }

    /* ========================================
       HOLOGRAM FOIL LAYER (::before)
       Main rainbow diffraction band
       ======================================== */
    .card::before {
      content: '';
      position: absolute;
      inset: -60%;
      z-index: 10;
      pointer-events: none;
      
      /* Large sweeping rainbow gradient - mostly transparent */
      background-image:
        linear-gradient(
          115deg,
          transparent 0%,
          transparent 15%,
          transparent 28%,
          rgba(255, 255, 255, 0.05) 35%,
          var(--color1) 42%,
          rgba(255, 255, 255, 0.5) 48%,
          var(--color2) 54%,
          rgba(255, 255, 255, 0.05) 62%,
          transparent 70%,
          transparent 100%
        );
      
      background-size: 320% 320%;
      background-position: var(--gradient-x) var(--gradient-y);
      
      mix-blend-mode: color-dodge;
      opacity: var(--foil-opacity);
      filter: 
        brightness(var(--foil-brightness))
        contrast(var(--foil-contrast));
      
      will-change: background-position, opacity, filter;
    }

    /* ========================================
       HOLOGRAM TEXTURE LAYER (::after)
       Multi-layer composition:
       - External holo texture
       - Rainbow gradient overlay
       - Sparkle pattern
       ======================================== */
    .card::after {
      content: '';
      position: absolute;
      inset: -60%;
      z-index: 11;
      pointer-events: none;
      
      /* Multiple backgrounds with different sizes/positions */
      background-image:
        /* Sparkle pattern (CSS generated) */
        radial-gradient(
          circle at 15% 25%,
          rgba(255, 255, 255, 0.9) 0px,
          rgba(255, 255, 255, 0.4) 1px,
          transparent 2px
        ),
        radial-gradient(
          circle at 85% 15%,
          rgba(255, 255, 255, 0.7) 0px,
          rgba(255, 255, 255, 0.3) 1px,
          transparent 2px
        ),
        radial-gradient(
          circle at 75% 75%,
          rgba(255, 255, 255, 0.8) 0px,
          rgba(255, 255, 255, 0.35) 1px,
          transparent 2px
        ),
        radial-gradient(
          circle at 25% 85%,
          rgba(255, 255, 255, 0.6) 0px,
          rgba(255, 255, 255, 0.25) 1px,
          transparent 2px
        ),
        radial-gradient(
          circle at 50% 50%,
          rgba(255, 255, 255, 1) 0px,
          rgba(255, 255, 255, 0.5) 1.5px,
          transparent 3px
        ),
        radial-gradient(
          circle at 35% 35%,
          rgba(255, 255, 255, 0.85) 0px,
          rgba(255, 255, 255, 0.4) 1px,
          transparent 2px
        ),
        /* External holo texture */
        url("https://assets.codepen.io/13471/holo.png"),
        /* Rainbow gradient */
        linear-gradient(
          125deg,
          rgba(255, 0, 80, 0.5) 12%,
          rgba(252, 164, 0, 0.4) 28%,
          rgba(255, 255, 0, 0.3) 38%,
          rgba(0, 255, 138, 0.25) 55%,
          rgba(0, 207, 255, 0.4) 68%,
          rgba(204, 76, 250, 0.5) 82%
        );
      
      /* Different sizes for parallax effect */
      background-size:
        100% 100%,
        100% 100%,
        100% 100%,
        100% 100%,
        80% 80%,
        100% 100%,
        200% 200%,
        280% 280%;
      
      /* Different positions for different movement speeds */
      background-position:
        var(--sparkle-x) var(--sparkle-y),
        var(--sparkle-x) var(--sparkle-y),
        var(--sparkle-x) var(--sparkle-y),
        var(--sparkle-x) var(--sparkle-y),
        var(--sparkle-x) var(--sparkle-y),
        var(--sparkle-x) var(--sparkle-y),
        var(--holo-x) var(--holo-y),
        var(--gradient-x) var(--gradient-y);
      
      background-blend-mode: 
        overlay,
        overlay,
        overlay,
        overlay,
        overlay,
        overlay,
        color-dodge,
        normal;
      
      mix-blend-mode: color-dodge;
      opacity: var(--sparkle-opacity);
      
      will-change: background-position, opacity;
    }

    /* ========================================
       SPECULAR HIGHLIGHT BAND
       Strong diagonal reflection
       ======================================== */
    .holo-specular {
      position: absolute;
      inset: -50%;
      z-index: 12;
      pointer-events: none;
      
      background: 
        /* Main specular band */
        linear-gradient(
          108deg,
          transparent 0%,
          transparent 32%,
          rgba(255, 255, 255, 0.03) 38%,
          rgba(255, 255, 255, 0.12) 44%,
          rgba(255, 255, 255, 0.75) 50%,
          rgba(255, 255, 255, 0.35) 54%,
          rgba(255, 255, 255, 0.08) 60%,
          transparent 68%,
          transparent 100%
        ),
        /* Secondary soft glow */
        radial-gradient(
          ellipse 80% 40% at var(--light-x) var(--light-y),
          rgba(255, 255, 255, 0.15) 0%,
          transparent 60%
        );
      
      background-size: 300% 300%, 200% 200%;
      background-position: var(--light-x) var(--light-y), var(--light-x) var(--light-y);
      
      mix-blend-mode: screen;
      opacity: var(--specular-intensity);
      
      will-change: background-position, opacity;
    }

    /* ========================================
       GLARE BAND
       Secondary diagonal reflection
       ======================================== */
    .holo-glare {
      position: absolute;
      inset: -50%;
      z-index: 13;
      pointer-events: none;
      
      background: linear-gradient(
        72deg,
        transparent 0%,
        transparent 25%,
        rgba(255, 255, 255, 0.06) 32%,
        rgba(255, 255, 255, 0.25) 38%,
        rgba(255, 255, 255, 0.08) 44%,
        transparent 52%,
        transparent 100%
      );
      
      background-size: 280% 280%;
      background-position: var(--light-x) var(--light-y);
      
      mix-blend-mode: color-dodge;
      opacity: var(--glare-opacity);
      
      will-change: background-position, opacity;
    }

    /* ========================================
       MICRO GRAIN TEXTURE
       Very subtle surface texture
       ======================================== */
    .holo-grain {
      position: absolute;
      inset: 0;
      z-index: 14;
      pointer-events: none;
      opacity: 0.06;
      
      background:
        repeating-linear-gradient(
          0deg,
          transparent 0px,
          transparent 1px,
          rgba(255, 255, 255, 0.1) 1px,
          rgba(255, 255, 255, 0.1) 2px
        ),
        repeating-linear-gradient(
          90deg,
          transparent 0px,
          transparent 1px,
          rgba(255, 255, 255, 0.08) 1px,
          rgba(255, 255, 255, 0.08) 2px
        ),
        repeating-linear-gradient(
          45deg,
          transparent 0px,
          transparent 3px,
          rgba(255, 255, 255, 0.03) 3px,
          rgba(255, 255, 255, 0.03) 4px
        );
      
      mix-blend-mode: overlay;
    }

    /* ========================================
       INACTIVE STATE
       Reduced holo effect when motion not active
       ======================================== */
    .card:not(.motion-active)::before {
      opacity: 0.08;
      filter: brightness(0.7) contrast(0.8);
    }

    .card:not(.motion-active)::after {
      opacity: 0.05;
    }

    .card:not(.motion-active) .holo-specular {
      opacity: 0.1;
    }

    .card:not(.motion-active) .holo-glare {
      opacity: 0.05;
    }

    /* ========================================
       INSTRUCTIONS
       ======================================== */
    .instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(-50% - 120px));
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 15px;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    .instructions.hidden {
      opacity: 0;
    }

    .instructions svg {
      width: 52px;
      height: 52px;
      margin-bottom: 14px;
      opacity: 0.35;
    }

    .instructions p {
      margin-top: 8px;
      font-size: 13px;
      opacity: 0.6;
    }

    /* ========================================
       CONTROLS
       ======================================== */
    .controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px 16px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(to top, rgba(9, 9, 9, 0.95) 0%, rgba(9, 9, 9, 0.8) 70%, transparent 100%);
      z-index: 100;
    }

    .btn {
      width: 100%;
      max-width: 280px;
      padding: 15px 24px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: rgba(0, 200, 255, 0.15);
      border-color: rgba(0, 200, 255, 0.3);
    }

    .btn-primary:hover {
      background: rgba(0, 200, 255, 0.25);
      border-color: rgba(0, 200, 255, 0.45);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 280px;
    }

    .btn-row .btn {
      flex: 1;
      font-size: 12px;
      padding: 12px 16px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Hidden file input */
    #file-input {
      display: none;
    }

    /* ========================================
       DEBUG INFO
       ======================================== */
    .debug {
      position: fixed;
      top: 40px;
      left: 10px;
      font-size: 10px;
      font-family: monospace;
      color: rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 6px;
      line-height: 1.6;
      pointer-events: none;
      z-index: 1000;
      display: none;
    }

    /* ========================================
       PRESETS
       ======================================== */
    .card[data-preset="rainbow"] {
      --color1: rgb(255, 0, 80);
      --color2: rgb(204, 76, 250);
    }

    .card[data-preset="gold"] {
      --color1: rgb(255, 215, 0);
      --color2: rgb(255, 140, 0);
    }

    .card[data-preset="silver"] {
      --color1: rgb(192, 192, 192);
      --color2: rgb(128, 128, 128);
    }

    .card[data-preset="galaxy"] {
      --color1: rgb(138, 43, 226);
      --color2: rgb(75, 0, 130);
    }

    .card[data-preset="aurora"] {
      --color1: rgb(0, 255, 127);
      --color2: rgb(0, 191, 255);
    }

    /* ========================================
       LOADING STATE
       ======================================== */
    .card.loading::before,
    .card.loading::after {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="status" id="status">카드 업로드 필요</div>

    <div class="instructions" id="instructions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <div>카드 이미지 업로드</div>
      <p>포켓몬, 스포츠, 포토카드</p>
    </div>

    <div class="card motion-active" id="card">
      <img class="card__image" id="card-image" alt="Card">
      <div class="holo-specular"></div>
      <div class="holo-glare"></div>
      <div class="holo-grain"></div>
    </div>

    <input type="file" id="file-input" accept="image/*">

    <div class="controls">
      <button class="btn" id="upload-btn">카드 변경</button>
      <button class="btn btn-primary" id="motion-btn">모션 효과 시작</button>
      <div class="btn-row">
        <button class="btn" id="recalibrate-btn" style="display: none;">재보정</button>
        <button class="btn" id="preset-btn">프리셋 변경</button>
      </div>
    </div>

    <div class="debug" id="debug">
      gamma: <span id="d-gamma">0</span><br>
      beta: <span id="d-beta">0</span><br>
      target: <span id="d-target">0, 0</span><br>
      current: <span id="d-current">0, 0</span><br>
      intensity: <span id="d-intensity">0</span>
    </div>
  </div>

  <script>
    /**
     * ========================================
     * HOLOGRAPHIC CARD VIEWER
     * ========================================
     * 
     * Settings for easy tuning
     */
    const SETTINGS = {
      // Sensor range (±degrees for full effect)
      sensorRange: 30,
      
      // Card movement
      cardRotateX: 5,        // degrees
      cardRotateY: 5,         // degrees
      cardTranslate: 3,      // pixels
      
      // Layer travel distances (%)
      gradientTravel: 75,
      holoTravel: 45,
      sparkleTravel: 20,
      lightTravel: 95,
      
      // Smoothing factors (higher = faster response)
      cardSmoothing: 0.065,
      foilSmoothing: 0.10,
      sparkleSmoothing: 0.045,
      
      // Dead zone (ignore small movements)
      deadZone: 0.025,
      
      // Movement direction multipliers
      cardDirectionX: 1,
      cardDirectionY: -1,
      
      gradientDirectionX: -1,
      gradientDirectionY: -1,
      
      holoDirectionX: -0.6,
      holoDirectionY: -0.6,
      
      sparkleDirectionX: 0.25,
      sparkleDirectionY: 0.25,
      
      lightDirectionX: -1,
      lightDirectionY: -1,
    };

    // ========================================
    // STATE
    // ========================================
    
    // Calibration
    let centerGamma = 0;
    let centerBeta = 0;
    
    // Target values from sensor
    let targetX = 0;
    let targetY = 0;
    
    // Smoothed values for different layers
    let cardX = 0;
    let cardY = 0;
    let foilX = 0;
    let foilY = 0;
    let sparkX = 0;
    let sparkY = 0;
    
    // Motion state
    let isMotionActive = false;
    let isRecalibrated = false;
    let isImageLoaded = false;
    
    // Preset rotation
    const presets = ['rainbow', 'gold', 'silver', 'galaxy', 'aurora', 'default'];
    let currentPresetIndex = 5; // 'default' (cyan/magenta)
    
    // DOM elements
    let card, cardImage, statusEl, instructionsEl;
    let uploadBtn, motionBtn, recalibrateBtn, presetBtn;
    let debugEl, dGamma, dBeta, dTarget, dCurrent, dIntensity;

    // ========================================
    // UTILITIES
    // ========================================
    
    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }
    
    function lerp(start, end, factor) {
      return start + (end - start) * factor;
    }
    
    /**
     * Apply dead zone to ignore small movements
     */
    function applyDeadZone(value, zone = SETTINGS.deadZone) {
      if (Math.abs(value) < zone) return 0;
      const sign = value > 0 ? 1 : -1;
      const adjusted = (Math.abs(value) - zone) / (1 - zone);
      return sign * clamp(adjusted, 0, 1);
    }
    
    /**
     * Smooth step for highlight calculation
     */
    function smoothstep(edge0, edge1, x) {
      const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    }
    
    /**
     * Calculate highlight intensity based on diagonal position
     */
    function calculateIntensity(x, y) {
      // Combine X and Y into diagonal value
      const diagonal = x * 0.7 + y * 0.3;
      
      // Create flash effect at certain angles
      const highlight = smoothstep(-0.8, -0.2, diagonal) * (1 - smoothstep(0.2, 0.8, diagonal));
      
      // Base intensity + highlight boost
      return 0.3 + highlight * 0.7;
    }

    // ========================================
    // INITIALIZATION
    // ========================================
    
    function init() {
      // Cache DOM
      card = document.getElementById('card');
      cardImage = document.getElementById('card-image');
      statusEl = document.getElementById('status');
      instructionsEl = document.getElementById('instructions');
      uploadBtn = document.getElementById('upload-btn');
      motionBtn = document.getElementById('motion-btn');
      recalibrateBtn = document.getElementById('recalibrate-btn');
      presetBtn = document.getElementById('preset-btn');
      
      debugEl = document.getElementById('debug');
      dGamma = document.getElementById('d-gamma');
      dBeta = document.getElementById('d-beta');
      dTarget = document.getElementById('d-target');
      dCurrent = document.getElementById('d-current');
      dIntensity = document.getElementById('d-intensity');
      
      // Event listeners
      document.getElementById('file-input').addEventListener('change', handleFileSelect);
      uploadBtn.addEventListener('click', () => document.getElementById('file-input').click());
      motionBtn.addEventListener('click', handleMotionButton);
      recalibrateBtn.addEventListener('click', resetCenter);
      presetBtn.addEventListener('click', cyclePreset);
      
      // Mouse fallback
      document.addEventListener('pointermove', handlePointerMove);
      
      // Start animation
      requestAnimationFrame(animate);
      
      // Restore saved image
      const savedImage = localStorage.getItem('hologram-card-image');
      if (savedImage) {
        loadImage(savedImage);
      }
      
      // Initial state - remove motion-active until activated
      card.classList.remove('motion-active');
      
      console.log('Holographic Card Viewer initialized');
    }

    // ========================================
    // FILE HANDLING
    // ========================================
    
    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (event) => {
        const dataUrl = event.target.result;
        loadImage(dataUrl);
        localStorage.setItem('hologram-card-image', dataUrl);
      };
      reader.readAsDataURL(file);
    }
    
    function loadImage(src) {
      cardImage.src = src;
      isImageLoaded = true;
      instructionsEl.classList.add('hidden');
      statusEl.textContent = '모션 활성';
      statusEl.classList.add('active');
      
      // Auto-start motion on mobile
      if (isMobileDevice() && typeof DeviceOrientationEvent !== 'undefined') {
        requestMotionPermission();
      } else {
        // Desktop - start mouse tracking
        startMotion();
      }
    }

    // ========================================
    // MOTION HANDLING
    // ========================================
    
    function handleMotionButton() {
      if (isMobileDevice() && typeof DeviceOrientationEvent !== 'undefined') {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          requestMotionPermission();
        } else {
          startMotion();
        }
      } else {
        startMotion();
      }
    }
    
    async function requestMotionPermission() {
      try {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission === 'granted') {
          startMotion();
        } else {
          statusEl.textContent = '권한 거부됨';
          alert('모션 센서 권한이 필요합니다.\n설정에서 허용해주세요.');
        }
      } catch (error) {
        console.error('Permission error:', error);
        startMotion(); // Fallback to mouse
      }
    }
    
    function startMotion() {
      if (isMobileDevice()) {
        window.addEventListener('deviceorientation', handleOrientation, true);
      }
      
      isMotionActive = true;
      card.classList.add('motion-active');
      statusEl.textContent = '모션 활성';
      statusEl.classList.add('active');
      motionBtn.textContent = '모션 활성됨';
      motionBtn.disabled = true;
      recalibrateBtn.style.display = 'block';
      
      console.log('Motion tracking started');
    }
    
    function handleOrientation(event) {
      const gamma = event.gamma || 0;
      const beta = event.beta || 0;
      
      // Calibration on first reading
      if (!isRecalibrated) {
        centerGamma = gamma;
        centerBeta = beta;
        isRecalibrated = true;
        console.log(`Calibrated: gamma=${centerGamma.toFixed(1)}, beta=${centerBeta.toFixed(1)}`);
      }
      
      // Calculate relative tilt
      const relGamma = gamma - centerGamma;
      const relBeta = beta - centerBeta;
      
      // Update targets with dead zone
      targetX = applyDeadZone(relGamma / SETTINGS.sensorRange);
      targetY = applyDeadZone(relBeta / SETTINGS.sensorRange);
      
      // Clamp
      targetX = clamp(targetX, -1, 1);
      targetY = clamp(targetY, -1, 1);
      
      updateDebug(gamma, beta);
    }
    
    function handlePointerMove(event) {
      if (!isRecalibrated) {
        isRecalibrated = true;
      }
      
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      
      // Calculate normalized position (-1 to 1)
      let x = (event.clientX - centerX) / centerX;
      let y = (centerY - event.clientY) / centerY;
      
      // Apply dead zone
      targetX = applyDeadZone(x);
      targetY = applyDeadZone(y);
      
      updateDebug(0, 0);
    }
    
    function updateDebug(gamma, beta) {
      if (debugEl.style.display !== 'none') {
        dGamma.textContent = gamma.toFixed(1);
        dBeta.textContent = beta.toFixed(1);
        dTarget.textContent = `${targetX.toFixed(2)}, ${targetY.toFixed(2)}`;
        dCurrent.textContent = `${cardX.toFixed(2)}, ${cardY.toFixed(2)}`;
      }
    }
    
    function resetCenter() {
      if (!isMotionActive) return;
      
      isRecalibrated = false;
      centerGamma = 0;
      centerBeta = 0;
      targetX = 0;
      targetY = 0;
      
      statusEl.textContent = '재보정 완료';
      setTimeout(() => {
        statusEl.textContent = '모션 활성';
      }, 1000);
    }
    
    function cyclePreset() {
      currentPresetIndex = (currentPresetIndex + 1) % presets.length;
      const preset = presets[currentPresetIndex];
      
      if (preset === 'default') {
        card.removeAttribute('data-preset');
      } else {
        card.setAttribute('data-preset', preset);
      }
      
      statusEl.textContent = `프리셋: ${preset}`;
      setTimeout(() => {
        statusEl.textContent = '모션 활성';
      }, 1000);
    }

    // ========================================
    // ANIMATION LOOP
    // ========================================
    
    function animate() {
      // Smooth interpolation with different speeds per layer
      
      // Card movement (slowest)
      cardX += (targetX - cardX) * SETTINGS.cardSmoothing;
      cardY += (targetY - cardY) * SETTINGS.cardSmoothing;
      
      // Foil/gradient movement (medium)
      foilX += (targetX - foilX) * SETTINGS.foilSmoothing;
      foilY += (targetY - foilY) * SETTINGS.foilSmoothing;
      
      // Sparkle movement (slowest - behind everything)
      sparkX += (targetX - sparkX) * SETTINGS.sparkleSmoothing;
      sparkY += (targetY - sparkY) * SETTINGS.sparkleSmoothing;
      
      // Update
      updateCard();
      updateHologram();
      updateDebugDisplay();
      
      requestAnimationFrame(animate);
    }
    
    function updateCard() {
      const root = document.documentElement;
      
      // Card rotation
      const rx = cardY * SETTINGS.cardDirectionY * SETTINGS.cardRotateX;
      const ry = cardX * SETTINGS.cardDirectionX * SETTINGS.cardRotateY;
      
      // Card translation
      const tx = cardX * SETTINGS.cardTranslate;
      const ty = cardY * SETTINGS.cardTranslate;
      
      root.style.setProperty('--card-rx', `${rx}deg`);
      root.style.setProperty('--card-ry', `${ry}deg`);
      root.style.setProperty('--card-x', `${tx}px`);
      root.style.setProperty('--card-y', `${ty}px`);
      
      // Edge glow intensity
      const tiltAmount = Math.sqrt(cardX * cardX + cardY * cardY);
      root.style.setProperty('--edge-glow', tiltAmount.toFixed(2));
    }
    
    function updateHologram() {
      const root = document.documentElement;
      
      // Calculate positions with different multipliers and directions
      const gradientX = 50 + foilX * SETTINGS.gradientDirectionX * SETTINGS.gradientTravel;
      const gradientY = 50 + foilY * SETTINGS.gradientDirectionY * SETTINGS.gradientTravel;
      
      const holoX = 50 + foilX * SETTINGS.holoDirectionX * SETTINGS.holoTravel;
      const holoY = 50 + foilY * SETTINGS.holoDirectionY * SETTINGS.holoTravel;
      
      const sparkleX = 50 + sparkX * SETTINGS.sparkleDirectionX * SETTINGS.sparkleTravel;
      const sparkleY = 50 + sparkY * SETTINGS.sparkleDirectionY * SETTINGS.sparkleTravel;
      
      const lightX = 50 + foilX * SETTINGS.lightDirectionX * SETTINGS.lightTravel;
      const lightY = 50 + foilY * SETTINGS.lightDirectionY * SETTINGS.lightTravel;
      
      // Apply positions
      root.style.setProperty('--gradient-x', `${gradientX}%`);
      root.style.setProperty('--gradient-y', `${gradientY}%`);
      root.style.setProperty('--holo-x', `${holoX}%`);
      root.style.setProperty('--holo-y', `${holoY}%`);
      root.style.setProperty('--sparkle-x', `${sparkleX}%`);
      root.style.setProperty('--sparkle-y', `${sparkleY}%`);
      root.style.setProperty('--light-x', `${lightX}%`);
      root.style.setProperty('--light-y', `${lightY}%`);
      
      // Calculate intensity based on position
      const intensity = calculateIntensity(foilX, foilY);
      
      // Apply intensity-based effects
      const foilOpacity = 0.25 + intensity * 0.45;
      const foilBrightness = 0.75 + intensity * 0.45;
      const foilContrast = 0.9 + intensity * 0.4;
      
      const sparkleOpacity = 0.08 + intensity * 0.4;
      const specularIntensity = 0.2 + intensity * 0.75;
      const glareOpacity = 0.15 + intensity * 0.45;
      
      root.style.setProperty('--foil-opacity', foilOpacity.toFixed(2));
      root.style.setProperty('--foil-brightness', foilBrightness.toFixed(2));
      root.style.setProperty('--foil-contrast', foilContrast.toFixed(2));
      root.style.setProperty('--sparkle-opacity', sparkleOpacity.toFixed(2));
      root.style.setProperty('--specular-intensity', specularIntensity.toFixed(2));
      root.style.setProperty('--glare-opacity', glareOpacity.toFixed(2));
      
      // Update debug
      if (debugEl.style.display !== 'none') {
        dIntensity.textContent = intensity.toFixed(2);
      }
    }
    
    function updateDebugDisplay() {
      if (debugEl.style.display !== 'none') {
        dCurrent.textContent = `${cardX.toFixed(2)}, ${cardY.toFixed(2)}`;
      }
    }

    // ========================================
    // DEVICE DETECTION
    // ========================================
    
    function isMobileDevice() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    // ========================================
    // DEBUG TOGGLE (tap card 5x)
    // ========================================
    
    let tapCount = 0;
    let tapTimer = null;
    
    card?.addEventListener('click', () => {
      if (!isImageLoaded) return;
      
      tapCount++;
      clearTimeout(tapTimer);
      
      if (tapCount >= 5) {
        debugEl.style.display = debugEl.style.display === 'none' ? 'block' : 'none';
        tapCount = 0;
      } else {
        tapTimer = setTimeout(() => tapCount = 0, 1000);
      }
    });

    // ========================================
    // START
    // ========================================
    
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
