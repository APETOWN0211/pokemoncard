<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Holographic Card Viewer</title>
  <style>
    /* ========================================
       CSS CUSTOM PROPERTIES
       ======================================== */
    :root {
      /* Holo Color Presets */
      --color1: rgb(0, 231, 255);
      --color2: rgb(255, 0, 231);
      
      /* Card 3D Transform */
      --rotate-x: 0deg;
      --rotate-y: 0deg;
      --card-scale: 1;
      
      /* Dynamic Position Variables */
      --gradient-x: 50%;
      --gradient-y: 50%;
      --holo-x: 50%;
      --holo-y: 50%;
      --sparkle-x: 50%;
      --sparkle-y: 50%;
      --light-x: 50%;
      --light-y: 50%;
      
      /* Intensity Variables */
      --foil-opacity: 0.4;
      --foil-brightness: 0.9;
      --foil-contrast: 1.1;
      --glare-opacity: 0.3;
      --sparkle-opacity: 0.15;
      --specular-intensity: 0.5;
      
      /* Card Dimensions */
      --card-width: min(90vw, 410px);
    }

    /* ========================================
       RESET & BASE
       ======================================== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #090909;
      color: #fff;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ========================================
       APP CONTAINER
       ======================================== */
    .app {
      width: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 20px) 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    }

    /* ========================================
       CARD STAGE (Perspective Container)
       ======================================== */
    .card-stage {
      perspective: 850px;
      perspective-origin: center center;
    }

    /* ========================================
       STATUS
       ======================================== */
    .status {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
      z-index: 100;
      transition: color 0.3s;
    }

    .status.active {
      color: rgba(100, 200, 255, 0.7);
    }

    /* ========================================
       CARD CONTAINER
       The card has real 3D rotation based on pointer/orientation
       ======================================== */
    .card {
      --aspect: 2.5 / 3.5;
      
      width: var(--card-width);
      aspect-ratio: var(--aspect);
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      
      /* 3D transformation - THE CARD ACTUALLY ROTATES */
      transform-style: preserve-3d;
      transform-origin: center center;
      transform:
        scale(var(--card-scale))
        rotateX(var(--rotate-x))
        rotateY(var(--rotate-y));
      
      /* Dynamic shadow based on rotation */
      box-shadow:
        0 35px 60px -15px rgba(0, 0, 0, 0.7),
        0 50px 80px -20px rgba(0, 0, 0, 0.5);
      
      background: #1a1a1a;
      will-change: transform;
    }

    /* ========================================
       CARD IMAGE
       ======================================== */
    .card__image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: linear-gradient(145deg, #222 0%, #111 100%);
      z-index: 1;
    }

    /* ========================================
       HOLOGRAM FOIL LAYER (::before)
       Main rainbow diffraction band
       ======================================== */
    .card::before {
      content: '';
      position: absolute;
      inset: -60%;
      z-index: 10;
      pointer-events: none;
      
      background-image:
        linear-gradient(
          115deg,
          transparent 0%,
          transparent 15%,
          transparent 28%,
          rgba(255, 255, 255, 0.05) 35%,
          var(--color1) 42%,
          rgba(255, 255, 255, 0.5) 48%,
          var(--color2) 54%,
          rgba(255, 255, 255, 0.05) 62%,
          transparent 70%,
          transparent 100%
        );
      
      background-size: 320% 320%;
      background-position: var(--gradient-x) var(--gradient-y);
      
      mix-blend-mode: color-dodge;
      opacity: var(--foil-opacity);
      filter: 
        brightness(var(--foil-brightness))
        contrast(var(--foil-contrast));
      
      will-change: background-position, opacity, filter;
    }

    /* ========================================
       HOLOGRAM TEXTURE LAYER (::after)
       Multi-layer composition
       ======================================== */
    .card::after {
      content: '';
      position: absolute;
      inset: -60%;
      z-index: 11;
      pointer-events: none;
      
      background-image:
        /* Sparkle patterns */
        radial-gradient(circle at 15% 25%, rgba(255, 255, 255, 0.9) 0px, rgba(255, 255, 255, 0.4) 1px, transparent 2px),
        radial-gradient(circle at 85% 15%, rgba(255, 255, 255, 0.7) 0px, rgba(255, 255, 255, 0.3) 1px, transparent 2px),
        radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.8) 0px, rgba(255, 255, 255, 0.35) 1px, transparent 2px),
        radial-gradient(circle at 25% 85%, rgba(255, 255, 255, 0.6) 0px, rgba(255, 255, 255, 0.25) 1px, transparent 2px),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 1) 0px, rgba(255, 255, 255, 0.5) 1.5px, transparent 3px),
        radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.85) 0px, rgba(255, 255, 255, 0.4) 1px, transparent 2px),
        /* External holo texture */
        url("https://assets.codepen.io/13471/holo.png"),
        /* Rainbow gradient */
        linear-gradient(125deg,
          rgba(255, 0, 80, 0.5) 12%,
          rgba(252, 164, 0, 0.4) 28%,
          rgba(255, 255, 0, 0.3) 38%,
          rgba(0, 255, 138, 0.25) 55%,
          rgba(0, 207, 255, 0.4) 68%,
          rgba(204, 76, 250, 0.5) 82%
        );
      
      background-size:
        100% 100%, 100% 100%, 100% 100%, 100% 100%, 80% 80%, 100% 100%,
        200% 200%,
        280% 280%;
      
      background-position:
        var(--sparkle-x) var(--sparkle-y),
        var(--sparkle-x) var(--sparkle-y),
        var(--sparkle-x) var(--sparkle-y),
        var(--sparkle-x) var(--sparkle-y),
        var(--sparkle-x) var(--sparkle-y),
        var(--sparkle-x) var(--sparkle-y),
        var(--holo-x) var(--holo-y),
        var(--gradient-x) var(--gradient-y);
      
      background-blend-mode: overlay, overlay, overlay, overlay, overlay, overlay, color-dodge, normal;
      mix-blend-mode: color-dodge;
      opacity: var(--sparkle-opacity);
      
      will-change: background-position, opacity;
    }

    /* ========================================
       SPECULAR HIGHLIGHT BAND
       Strong diagonal reflection
       ======================================== */
    .holo-specular {
      position: absolute;
      inset: -50%;
      z-index: 12;
      pointer-events: none;
      
      background: 
        linear-gradient(
          108deg,
          transparent 0%,
          transparent 32%,
          rgba(255, 255, 255, 0.03) 38%,
          rgba(255, 255, 255, 0.12) 44%,
          rgba(255, 255, 255, 0.75) 50%,
          rgba(255, 255, 255, 0.35) 54%,
          rgba(255, 255, 255, 0.08) 60%,
          transparent 68%,
          transparent 100%
        ),
        radial-gradient(
          ellipse 80% 40% at var(--light-x) var(--light-y),
          rgba(255, 255, 255, 0.15) 0%,
          transparent 60%
        );
      
      background-size: 300% 300%, 200% 200%;
      background-position: var(--light-x) var(--light-y), var(--light-x) var(--light-y);
      
      mix-blend-mode: screen;
      opacity: var(--specular-intensity);
      
      will-change: background-position, opacity;
    }

    /* ========================================
       GLARE BAND
       Secondary diagonal reflection
       ======================================== */
    .holo-glare {
      position: absolute;
      inset: -50%;
      z-index: 13;
      pointer-events: none;
      
      background: linear-gradient(
        72deg,
        transparent 0%,
        transparent 25%,
        rgba(255, 255, 255, 0.06) 32%,
        rgba(255, 255, 255, 0.25) 38%,
        rgba(255, 255, 255, 0.08) 44%,
        transparent 52%,
        transparent 100%
      );
      
      background-size: 280% 280%;
      background-position: var(--light-x) var(--light-y);
      
      mix-blend-mode: color-dodge;
      opacity: var(--glare-opacity);
      
      will-change: background-position, opacity;
    }

    /* ========================================
       MICRO GRAIN TEXTURE
       ======================================== */
    .holo-grain {
      position: absolute;
      inset: 0;
      z-index: 14;
      pointer-events: none;
      opacity: 0.06;
      
      background:
        repeating-linear-gradient(0deg, transparent 0px, transparent 1px, rgba(255, 255, 255, 0.1) 1px, rgba(255, 255, 255, 0.1) 2px),
        repeating-linear-gradient(90deg, transparent 0px, transparent 1px, rgba(255, 255, 255, 0.08) 1px, rgba(255, 255, 255, 0.08) 2px),
        repeating-linear-gradient(45deg, transparent 0px, transparent 3px, rgba(255, 255, 255, 0.03) 3px, rgba(255, 255, 255, 0.03) 4px);
      
      mix-blend-mode: overlay;
    }

    /* ========================================
       INACTIVE STATE
       ======================================== */
    .card:not(.motion-active)::before {
      opacity: 0.08;
      filter: brightness(0.7) contrast(0.8);
    }

    .card:not(.motion-active)::after {
      opacity: 0.05;
    }

    .card:not(.motion-active) .holo-specular {
      opacity: 0.1;
    }

    .card:not(.motion-active) .holo-glare {
      opacity: 0.05;
    }

    /* ========================================
       INSTRUCTIONS
       ======================================== */
    .instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(-50% - 120px));
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 15px;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    .instructions.hidden {
      opacity: 0;
    }

    .instructions svg {
      width: 52px;
      height: 52px;
      margin-bottom: 14px;
      opacity: 0.35;
    }

    .instructions p {
      margin-top: 8px;
      font-size: 13px;
      opacity: 0.6;
    }

    /* ========================================
       CONTROLS
       ======================================== */
    .controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px 16px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(to top, rgba(9, 9, 9, 0.95) 0%, rgba(9, 9, 9, 0.8) 70%, transparent 100%);
      z-index: 100;
    }

    .btn {
      width: 100%;
      max-width: 280px;
      padding: 15px 24px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(12px);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: rgba(0, 200, 255, 0.15);
      border-color: rgba(0, 200, 255, 0.3);
    }

    .btn-primary:hover {
      background: rgba(0, 200, 255, 0.25);
      border-color: rgba(0, 200, 255, 0.45);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 280px;
    }

    .btn-row .btn {
      flex: 1;
      font-size: 12px;
      padding: 12px 16px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #file-input {
      display: none;
    }

    /* ========================================
       DEBUG INFO
       ======================================== */
    .debug {
      position: fixed;
      top: 40px;
      left: 10px;
      font-size: 10px;
      font-family: monospace;
      color: rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 6px;
      line-height: 1.6;
      pointer-events: none;
      z-index: 1000;
      display: none;
    }

    /* ========================================
       PRESETS
       ======================================== */
    .card[data-preset="rainbow"] {
      --color1: rgb(255, 0, 80);
      --color2: rgb(204, 76, 250);
    }

    .card[data-preset="gold"] {
      --color1: rgb(255, 215, 0);
      --color2: rgb(255, 140, 0);
    }

    .card[data-preset="silver"] {
      --color1: rgb(192, 192, 192);
      --color2: rgb(128, 128, 128);
    }

    .card[data-preset="galaxy"] {
      --color1: rgb(138, 43, 226);
      --color2: rgb(75, 0, 130);
    }

    .card[data-preset="aurora"] {
      --color1: rgb(0, 255, 127);
      --color2: rgb(0, 191, 255);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="status" id="status">카드 업로드 필요</div>

    <div class="instructions" id="instructions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <div>카드 이미지 업로드</div>
      <p>포켓몬, 스포츠, 포토카드</p>
    </div>

    <div class="card-stage">
      <div class="card motion-active" id="card">
        <img class="card__image" id="card-image" alt="Card">
        <div class="holo-specular"></div>
        <div class="holo-glare"></div>
        <div class="holo-grain"></div>
      </div>
    </div>

    <input type="file" id="file-input" accept="image/*">

    <div class="controls">
      <button class="btn" id="upload-btn">카드 변경</button>
      <button class="btn btn-primary" id="motion-btn">모션 효과 시작</button>
      <div class="btn-row">
        <button class="btn" id="recalibrate-btn" style="display: none;">재보정</button>
        <button class="btn" id="preset-btn">프리셋 변경</button>
      </div>
    </div>

    <div class="debug" id="debug">
      x: <span id="d-x">0</span><br>
      y: <span id="d-y">0</span><br>
      rotateX: <span id="d-rx">0</span><br>
      rotateY: <span id="d-ry">0</span><br>
      intensity: <span id="d-intensity">0</span>
    </div>
  </div>

  <script>
    /**
     * ========================================
     * HOLOGRAPHIC CARD VIEWER
     * ========================================
     * 
     * The card rotates in 3D based on normalized coordinates.
     * Hologram effects move independently but based on same input.
     */

    // ========================================
    // SETTINGS - Easy tuning
    // ========================================
    
    const SETTINGS = {
      // Card 3D Rotation
      maxRotateX: 14,        // degrees (up/down)
      maxRotateY: 14,        // degrees (left/right)
      perspective: 850,      // px
      
      // Card Scale Effect
      enableScale: true,
      maxScale: 1.02,
      
      // Sensor Range (±degrees for full -1 to 1)
      sensorRange: 30,
      
      // Hologram Travel Distances (%)
      gradientTravel: 80,
      holoTravel: 55,
      sparkleTravel: 25,
      lightTravel: 100,
      
      // Hologram Movement Direction (relative to card rotation)
      // Negative = opposite direction to card
      gradientDirX: -1,
      gradientDirY: -1,
      holoDirX: -0.6,
      holoDirY: -0.6,
      sparkleDirX: 0.3,
      sparkleDirY: 0.3,
      lightDirX: -1,
      lightDirY: -1,
      
      // Smoothing (higher = faster)
      cardSmoothing: 0.085,
      foilSmoothing: 0.10,
      sparkleSmoothing: 0.05,
      
      // Dead Zone (ignore small movements)
      deadZone: 0.025,
    };

    // ========================================
    // STATE
    // ========================================
    
    let centerGamma = 0;
    let centerBeta = 0;
    
    let targetX = 0;
    let targetY = 0;
    
    // Smoothed values
    let currentX = 0;
    let currentY = 0;
    let foilX = 0;
    let foilY = 0;
    let sparkX = 0;
    let sparkY = 0;
    
    let isMotionActive = false;
    let isRecalibrated = false;
    let isImageLoaded = false;
    
    const presets = ['rainbow', 'gold', 'silver', 'galaxy', 'aurora', 'default'];
    let currentPresetIndex = 5;
    
    // DOM
    let card, cardImage, statusEl, instructionsEl;
    let uploadBtn, motionBtn, recalibrateBtn, presetBtn;
    let debugEl, dX, dY, dRx, dRy, dIntensity;

    // ========================================
    // UTILITIES
    // ========================================
    
    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }
    
    function applyDeadZone(value, zone = SETTINGS.deadZone) {
      if (Math.abs(value) < zone) return 0;
      const sign = value > 0 ? 1 : -1;
      const adjusted = (Math.abs(value) - zone) / (1 - zone);
      return sign * clamp(adjusted, 0, 1);
    }
    
    function smoothstep(edge0, edge1, x) {
      const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    }
    
    function calculateIntensity(x, y) {
      const diagonal = x * 0.7 + y * 0.3;
      const highlight = smoothstep(-0.8, -0.2, diagonal) * (1 - smoothstep(0.2, 0.8, diagonal));
      return 0.3 + highlight * 0.7;
    }

    // ========================================
    // INITIALIZATION
    // ========================================
    
    function init() {
      card = document.getElementById('card');
      cardImage = document.getElementById('card-image');
      statusEl = document.getElementById('status');
      instructionsEl = document.getElementById('instructions');
      uploadBtn = document.getElementById('upload-btn');
      motionBtn = document.getElementById('motion-btn');
      recalibrateBtn = document.getElementById('recalibrate-btn');
      presetBtn = document.getElementById('preset-btn');
      
      debugEl = document.getElementById('debug');
      dX = document.getElementById('d-x');
      dY = document.getElementById('d-y');
      dRx = document.getElementById('d-rx');
      dRy = document.getElementById('d-ry');
      dIntensity = document.getElementById('d-intensity');
      
      // Set perspective on stage
      document.querySelector('.card-stage').style.perspective = `${SETTINGS.perspective}px`;
      
      // Events
      document.getElementById('file-input').addEventListener('change', handleFileSelect);
      uploadBtn.addEventListener('click', () => document.getElementById('file-input').click());
      motionBtn.addEventListener('click', handleMotionButton);
      recalibrateBtn.addEventListener('click', resetCenter);
      presetBtn.addEventListener('click', cyclePreset);
      
      // Pointer tracking
      document.addEventListener('pointermove', handlePointerMove);
      
      // Start animation
      requestAnimationFrame(animate);
      
      // Restore saved image
      const savedImage = localStorage.getItem('hologram-card-image');
      if (savedImage) {
        loadImage(savedImage);
      }
      
      card.classList.remove('motion-active');
      
      console.log('Initialized - Card will rotate based on pointer/orientation');
    }

    // ========================================
    // FILE HANDLING
    // ========================================
    
    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (event) => {
        loadImage(event.target.result);
        localStorage.setItem('hologram-card-image', event.target.result);
      };
      reader.readAsDataURL(file);
    }
    
    function loadImage(src) {
      cardImage.src = src;
      isImageLoaded = true;
      instructionsEl.classList.add('hidden');
      statusEl.textContent = '모션 활성';
      statusEl.classList.add('active');
      
      if (isMobileDevice() && typeof DeviceOrientationEvent !== 'undefined') {
        requestMotionPermission();
      } else {
        startMotion();
      }
    }

    // ========================================
    // MOTION HANDLING
    // ========================================
    
    function handleMotionButton() {
      if (isMobileDevice() && typeof DeviceOrientationEvent !== 'undefined') {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          requestMotionPermission();
        } else {
          startMotion();
        }
      } else {
        startMotion();
      }
    }
    
    async function requestMotionPermission() {
      try {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission === 'granted') {
          startMotion();
        } else {
          statusEl.textContent = '권한 거부됨';
          alert('모션 센서 권한이 필요합니다.');
        }
      } catch (error) {
        console.error('Permission error:', error);
        startMotion();
      }
    }
    
    function startMotion() {
      if (isMobileDevice()) {
        window.addEventListener('deviceorientation', handleOrientation, true);
      }
      
      isMotionActive = true;
      card.classList.add('motion-active');
      statusEl.textContent = '모션 활성';
      statusEl.classList.add('active');
      motionBtn.textContent = '모션 활성됨';
      motionBtn.disabled = true;
      recalibrateBtn.style.display = 'block';
      
      console.log('Motion tracking started');
    }
    
    function handleOrientation(event) {
      const gamma = event.gamma || 0;
      const beta = event.beta || 0;
      
      if (!isRecalibrated) {
        centerGamma = gamma;
        centerBeta = beta;
        isRecalibrated = true;
        console.log(`Calibrated: gamma=${centerGamma.toFixed(1)}, beta=${centerBeta.toFixed(1)}`);
      }
      
      const relGamma = gamma - centerGamma;
      const relBeta = beta - centerBeta;
      
      targetX = applyDeadZone(relGamma / SETTINGS.sensorRange);
      targetY = applyDeadZone(relBeta / SETTINGS.sensorRange);
      
      targetX = clamp(targetX, -1, 1);
      targetY = clamp(targetY, -1, 1);
      
      updateDebug(gamma, beta);
    }
    
    function handlePointerMove(event) {
      if (!isRecalibrated) {
        isRecalibrated = true;
      }
      
      // Normalized coordinates: -1 to 1
      const x = ((event.clientX / window.innerWidth) - 0.5) * 2;
      const y = ((event.clientY / window.innerHeight) - 0.5) * 2;
      
      targetX = applyDeadZone(x);
      targetY = applyDeadZone(y);
      
      updateDebug(0, 0);
    }
    
    function updateDebug(gamma, beta) {
      if (debugEl.style.display !== 'none') {
        dX.textContent = targetX.toFixed(2);
        dY.textContent = targetY.toFixed(2);
      }
    }
    
    function resetCenter() {
      if (!isMotionActive) return;
      
      isRecalibrated = false;
      centerGamma = 0;
      centerBeta = 0;
      targetX = 0;
      targetY = 0;
      
      statusEl.textContent = '재보정 완료';
      setTimeout(() => {
        statusEl.textContent = '모션 활성';
      }, 1000);
    }
    
    function cyclePreset() {
      currentPresetIndex = (currentPresetIndex + 1) % presets.length;
      const preset = presets[currentPresetIndex];
      
      if (preset === 'default') {
        card.removeAttribute('data-preset');
      } else {
        card.setAttribute('data-preset', preset);
      }
      
      statusEl.textContent = `프리셋: ${preset}`;
      setTimeout(() => {
        statusEl.textContent = '모션 활성';
      }, 1000);
    }

    // ========================================
    // ANIMATION LOOP
    // ========================================
    
    function animate() {
      // Smooth interpolation with different speeds
      currentX += (targetX - currentX) * SETTINGS.cardSmoothing;
      currentY += (targetY - currentY) * SETTINGS.cardSmoothing;
      
      foilX += (targetX - foilX) * SETTINGS.foilSmoothing;
      foilY += (targetY - foilY) * SETTINGS.foilSmoothing;
      
      sparkX += (targetX - sparkX) * SETTINGS.sparkleSmoothing;
      sparkY += (targetY - sparkY) * SETTINGS.sparkleSmoothing;
      
      updateCard();
      updateHologram();
      updateDebugDisplay();
      
      requestAnimationFrame(animate);
    }
    
    function updateCard() {
      const root = document.documentElement;
      
      // Card 3D Rotation
      const rotateY = currentX * SETTINGS.maxRotateY;
      const rotateX = currentY * -SETTINGS.maxRotateX;
      
      // Subtle scale based on movement magnitude
      let scale = 1;
      if (SETTINGS.enableScale) {
        const magnitude = Math.sqrt(currentX * currentX + currentY * currentY);
        scale = 1 + magnitude * (SETTINGS.maxScale - 1);
      }
      
      root.style.setProperty('--rotate-x', `${rotateX}deg`);
      root.style.setProperty('--rotate-y', `${rotateY}deg`);
      root.style.setProperty('--card-scale', scale.toFixed(3));
      
      // Debug
      if (debugEl.style.display !== 'none') {
        dRx.textContent = `${rotateX.toFixed(1)}deg`;
        dRy.textContent = `${rotateY.toFixed(1)}deg`;
      }
    }
    
    function updateHologram() {
      const root = document.documentElement;
      
      // Gradient position (opposite to card direction)
      const gradientX = 50 + foilX * SETTINGS.gradientDirX * SETTINGS.gradientTravel;
      const gradientY = 50 + foilY * SETTINGS.gradientDirY * SETTINGS.gradientTravel;
      
      // Hologram texture position
      const holoX = 50 + foilX * SETTINGS.holoDirX * SETTINGS.holoTravel;
      const holoY = 50 + foilY * SETTINGS.holoDirY * SETTINGS.holoTravel;
      
      // Sparkle position (same direction as pointer)
      const sparkleX = 50 + sparkX * SETTINGS.sparkleDirX * SETTINGS.sparkleTravel;
      const sparkleY = 50 + sparkY * SETTINGS.sparkleDirY * SETTINGS.sparkleTravel;
      
      // Light/specular position (opposite to card direction)
      const lightX = 50 + foilX * SETTINGS.lightDirX * SETTINGS.lightTravel;
      const lightY = 50 + foilY * SETTINGS.lightDirY * SETTINGS.lightTravel;
      
      root.style.setProperty('--gradient-x', `${gradientX}%`);
      root.style.setProperty('--gradient-y', `${gradientY}%`);
      root.style.setProperty('--holo-x', `${holoX}%`);
      root.style.setProperty('--holo-y', `${holoY}%`);
      root.style.setProperty('--sparkle-x', `${sparkleX}%`);
      root.style.setProperty('--sparkle-y', `${sparkleY}%`);
      root.style.setProperty('--light-x', `${lightX}%`);
      root.style.setProperty('--light-y', `${lightY}%`);
      
      // Intensity-based effects
      const intensity = calculateIntensity(foilX, foilY);
      
      root.style.setProperty('--foil-opacity', (0.25 + intensity * 0.45).toFixed(2));
      root.style.setProperty('--foil-brightness', (0.75 + intensity * 0.45).toFixed(2));
      root.style.setProperty('--foil-contrast', (0.9 + intensity * 0.4).toFixed(2));
      root.style.setProperty('--sparkle-opacity', (0.08 + intensity * 0.4).toFixed(2));
      root.style.setProperty('--specular-intensity', (0.2 + intensity * 0.75).toFixed(2));
      root.style.setProperty('--glare-opacity', (0.15 + intensity * 0.45).toFixed(2));
      
      if (debugEl.style.display !== 'none') {
        dIntensity.textContent = intensity.toFixed(2);
      }
    }
    
    function updateDebugDisplay() {
      if (debugEl.style.display !== 'none') {
        dX.textContent = currentX.toFixed(2);
        dY.textContent = currentY.toFixed(2);
      }
    }

    // ========================================
    // DEVICE DETECTION
    // ========================================
    
    function isMobileDevice() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    // ========================================
    // DEBUG TOGGLE (tap card 5x)
    // ========================================
    
    let tapCount = 0;
    let tapTimer = null;
    
    card?.addEventListener('click', () => {
      if (!isImageLoaded) return;
      
      tapCount++;
      clearTimeout(tapTimer);
      
      if (tapCount >= 5) {
        debugEl.style.display = debugEl.style.display === 'none' ? 'block' : 'none';
        tapCount = 0;
      } else {
        tapTimer = setTimeout(() => tapCount = 0, 1000);
      }
    });

    // ========================================
    // START
    // ========================================
    
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
