<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Holographic Card Viewer</title>
  <style>
    /* ========================================
       CSS CUSTOM PROPERTIES
       ======================================== */
    :root {
      --color1: rgb(0, 231, 255);
      --color2: rgb(255, 0, 231);
      
      /* Card transform */
      --rotate-x: 0deg;
      --rotate-y: 0deg;
      
      /* Layer positions (in pixels, not %) */
      --holo-x: 0px;
      --holo-y: 0px;
      --glare-x: 0px;
      --glare-y: 0px;
      --sparkle-x: 0px;
      --sparkle-y: 0px;
      
      /* Intensities */
      --holo-opacity: 0.4;
      --glare-opacity: 0.25;
      --sparkle-opacity: 0.1;
      
      /* Card size */
      --card-width: min(90vw, 410px);
    }

    /* ========================================
       RESET
       ======================================== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #090909;
      color: #fff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ========================================
       APP CONTAINER
       ======================================== */
    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 0) 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    }

    /* ========================================
       CARD STAGE (Perspective)
       ======================================== */
    .card-stage {
      perspective: 900px;
      perspective-origin: center center;
      contain: layout;
    }

    /* ========================================
       STATUS
       ======================================== */
    .status {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
      z-index: 100;
    }

    .status.active {
      color: rgba(100, 200, 255, 0.7);
    }

    /* ========================================
       CARD
       Only transform changes per frame
       ======================================== */
    .card {
      width: var(--card-width);
      aspect-ratio: 2.5 / 3.5;
      position: relative;
      border-radius: 14px;
      overflow: visible;
      
      /* THE ONLY ANIMATED PROPERTY */
      transform-style: preserve-3d;
      transform: rotateX(var(--rotate-x)) rotateY(var(--rotate-y));
      
      /* Fixed shadow - never animated */
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      
      will-change: transform;
      contain: layout paint style;
    }

    /* ========================================
       CARD IMAGE
       ======================================== */
    .card__image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: linear-gradient(145deg, #222 0%, #111 100%);
      border-radius: 14px;
      z-index: 1;
    }

    /* ========================================
       HOLO LAYER
       Large fixed gradient, moved via transform
       ======================================== */
    .holo {
      position: absolute;
      inset: -80%;
      width: 260%;
      height: 260%;
      left: -80%;
      top: -80%;
      pointer-events: none;
      z-index: 10;
      
      /* Fixed gradient - NO background-position animation */
      background:
        linear-gradient(
          115deg,
          transparent 0%,
          transparent 15%,
          transparent 30%,
          rgba(255, 255, 255, 0.08) 38%,
          var(--color1) 44%,
          rgba(255, 255, 255, 0.7) 49%,
          var(--color2) 54%,
          rgba(255, 255, 255, 0.08) 62%,
          transparent 70%,
          transparent 100%
        );
      
      mix-blend-mode: color-dodge;
      
      /* Only transform and opacity animate */
      transform: translate3d(var(--holo-x), var(--holo-y), 0);
      opacity: var(--holo-opacity);
      
      will-change: transform, opacity;
      contain: layout paint;
    }

    /* ========================================
       GLARE LAYER
       Strong diagonal reflection, transform-based
       ======================================== */
    .glare {
      position: absolute;
      inset: -100%;
      width: 300%;
      height: 300%;
      left: -100%;
      top: -100%;
      pointer-events: none;
      z-index: 11;
      
      /* Fixed diagonal glare */
      background: linear-gradient(
        108deg,
        transparent 0%,
        transparent 38%,
        rgba(255, 255, 255, 0.12) 44%,
        rgba(255, 255, 255, 0.85) 50%,
        rgba(255, 255, 255, 0.2) 54%,
        transparent 60%,
        transparent 100%
      );
      
      mix-blend-mode: screen;
      
      /* Only transform and opacity animate */
      transform: translate3d(var(--glare-x), var(--glare-y), 0);
      opacity: var(--glare-opacity);
      
      will-change: transform, opacity;
      contain: layout paint;
    }

    /* ========================================
       SPARKLE LAYER
       CSS-based static sparkles, transform-based
       ======================================== */
    .sparkle {
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      left: -50%;
      top: -50%;
      pointer-events: none;
      z-index: 12;
      
      /* CSS-based sparkle pattern - NO GIF */
      background:
        radial-gradient(circle at 15% 25%, rgba(255, 255, 255, 0.8) 0.5px, transparent 1px),
        radial-gradient(circle at 85% 15%, rgba(255, 255, 255, 0.6) 0.5px, transparent 1px),
        radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.7) 0.5px, transparent 1px),
        radial-gradient(circle at 25% 85%, rgba(255, 255, 255, 0.5) 0.5px, transparent 1px),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.9) 0.5px, transparent 1px),
        radial-gradient(circle at 35% 65%, rgba(255, 255, 255, 0.6) 0.5px, transparent 1px),
        radial-gradient(circle at 65% 35%, rgba(255, 255, 255, 0.7) 0.5px, transparent 1px),
        radial-gradient(circle at 20% 60%, rgba(255, 255, 255, 0.5) 0.5px, transparent 1px);
      background-size: 24px 24px;
      
      mix-blend-mode: screen;
      
      /* Only transform and opacity animate */
      transform: translate3d(var(--sparkle-x), var(--sparkle-y), 0);
      opacity: var(--sparkle-opacity);
      
      will-change: transform, opacity;
      contain: layout paint;
    }

    /* ========================================
       INACTIVE STATE
       ======================================== */
    .card:not(.motion-active) .holo {
      opacity: 0.08;
    }

    .card:not(.motion-active) .glare {
      opacity: 0.05;
    }

    .card:not(.motion-active) .sparkle {
      opacity: 0.03;
    }

    /* ========================================
       INSTRUCTIONS
       ======================================== */
    .instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(-50% - 120px));
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 15px;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    .instructions.hidden {
      opacity: 0;
    }

    .instructions svg {
      width: 52px;
      height: 52px;
      margin-bottom: 14px;
      opacity: 0.35;
    }

    .instructions p {
      margin-top: 8px;
      font-size: 13px;
      opacity: 0.6;
    }

    /* ========================================
       CONTROLS
       ======================================== */
    .controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px 16px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(to top, rgba(9, 9, 9, 0.95) 0%, transparent 100%);
      z-index: 100;
    }

    .btn {
      width: 100%;
      max-width: 280px;
      padding: 15px 24px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: rgba(0, 200, 255, 0.15);
      border-color: rgba(0, 200, 255, 0.3);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 280px;
    }

    .btn-row .btn {
      flex: 1;
      font-size: 12px;
      padding: 12px 16px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #file-input {
      display: none;
    }

    /* ========================================
       DEBUG
       ======================================== */
    .debug {
      position: fixed;
      top: 40px;
      left: 10px;
      font-size: 10px;
      font-family: monospace;
      color: rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 6px;
      line-height: 1.6;
      pointer-events: none;
      z-index: 1000;
      display: none;
    }

    /* ========================================
       PRESETS
       ======================================== */
    .card[data-preset="rainbow"] {
      --color1: rgb(255, 0, 80);
      --color2: rgb(204, 76, 250);
    }

    .card[data-preset="gold"] {
      --color1: rgb(255, 215, 0);
      --color2: rgb(255, 140, 0);
    }

    .card[data-preset="silver"] {
      --color1: rgb(192, 192, 192);
      --color2: rgb(128, 128, 128);
    }

    .card[data-preset="galaxy"] {
      --color1: rgb(138, 43, 226);
      --color2: rgb(75, 0, 130);
    }

    .card[data-preset="aurora"] {
      --color1: rgb(0, 255, 127);
      --color2: rgb(0, 191, 255);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="status" id="status">카드 업로드 필요</div>

    <div class="instructions" id="instructions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <div>카드 이미지 업로드</div>
      <p>포켓몬, 스포츠, 포토카드</p>
    </div>

    <div class="card-stage">
      <div class="card motion-active" id="card">
        <img class="card__image" id="card-image" alt="Card">
        <div class="holo"></div>
        <div class="glare"></div>
        <div class="sparkle"></div>
      </div>
    </div>

    <input type="file" id="file-input" accept="image/*">

    <div class="controls">
      <button class="btn" id="upload-btn">카드 변경</button>
      <button class="btn btn-primary" id="motion-btn">모션 효과 시작</button>
      <div class="btn-row">
        <button class="btn" id="recalibrate-btn" style="display: none;">재보정</button>
        <button class="btn" id="preset-btn">프리셋 변경</button>
      </div>
    </div>

    <div class="debug" id="debug">
      x: <span id="d-x">0</span><br>
      y: <span id="d-y">0</span><br>
      rx: <span id="d-rx">0</span><br>
      ry: <span id="d-ry">0</span>
    </div>
  </div>

  <script>
    /**
     * ========================================
     * PERFORMANCE-OPTIMIZED HOLOGRAPHIC VIEWER
     * ========================================
     * 
     * Only transform + opacity change per frame
     * No background-position, no filters, no box-shadow animation
     */

    // ========================================
    // SETTINGS
    // ========================================
    
    const SETTINGS = {
      // Card 3D Rotation
      maxRotateX: 14,
      maxRotateY: 14,
      
      // Layer movement (pixels)
      holoRange: 180,
      glareRange: 220,
      sparkleRange: 100,
      
      // Movement direction (relative to card)
      holoDirX: -1,
      holoDirY: -1,
      glareDirX: -1,
      glareDirY: -1,
      sparkleDirX: 0.3,
      sparkleDirY: 0.3,
      
      // Smoothing
      smoothing: 0.1,
      
      // Dead zone
      deadZone: 0.02,
      
      // Sensor range (±degrees)
      sensorRange: 30,
    };

    // ========================================
    // STATE
    // ========================================
    
    let centerGamma = 0;
    let centerBeta = 0;
    let targetX = 0;
    let targetY = 0;
    let currentX = 0;
    let currentY = 0;
    
    let isMotionActive = false;
    let isRecalibrated = false;
    let isImageLoaded = false;
    
    const presets = ['rainbow', 'gold', 'silver', 'galaxy', 'aurora', 'default'];
    let currentPresetIndex = 5;
    
    // Performance tracking
    let lastRenderX = 0;
    let lastRenderY = 0;
    const EPSILON = 0.002;
    let needsUpdate = true;
    
    // DOM cache
    let card, cardImage, statusEl, instructionsEl;
    let uploadBtn, motionBtn, recalibrateBtn, presetBtn;
    let debugEl, dX, dY, dRx, dRy;

    // ========================================
    // UTILITIES
    // ========================================
    
    function clamp(v, min, max) {
      return Math.min(Math.max(v, min), max);
    }
    
    function applyDeadZone(v, zone = SETTINGS.deadZone) {
      if (Math.abs(v) < zone) return 0;
      const sign = v > 0 ? 1 : -1;
      return sign * clamp((Math.abs(v) - zone) / (1 - zone), 0, 1);
    }

    // ========================================
    // INIT
    // ========================================
    
    function init() {
      card = document.getElementById('card');
      cardImage = document.getElementById('card-image');
      statusEl = document.getElementById('status');
      instructionsEl = document.getElementById('instructions');
      uploadBtn = document.getElementById('upload-btn');
      motionBtn = document.getElementById('motion-btn');
      recalibrateBtn = document.getElementById('recalibrate-btn');
      presetBtn = document.getElementById('preset-btn');
      
      debugEl = document.getElementById('debug');
      dX = document.getElementById('d-x');
      dY = document.getElementById('d-y');
      dRx = document.getElementById('d-rx');
      dRy = document.getElementById('d-ry');
      
      // Events - NO transition during motion
      document.getElementById('file-input').addEventListener('change', handleFileSelect);
      uploadBtn.addEventListener('click', () => document.getElementById('file-input').click());
      motionBtn.addEventListener('click', handleMotionButton);
      recalibrateBtn.addEventListener('click', resetCenter);
      presetBtn.addEventListener('click', cyclePreset);
      
      // Pointer tracking
      document.addEventListener('pointermove', handlePointerMove, { passive: true });
      
      // Single animation loop
      requestAnimationFrame(animate);
      
      // Restore saved image
      const saved = localStorage.getItem('hologram-card-image');
      if (saved) loadImage(saved);
      
      card.classList.remove('motion-active');
      
      console.log('Optimized viewer initialized');
    }

    // ========================================
    // FILE HANDLING
    // ========================================
    
    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (ev) => {
        loadImage(ev.target.result);
        localStorage.setItem('hologram-card-image', ev.target.result);
      };
      reader.readAsDataURL(file);
    }
    
    function loadImage(src) {
      cardImage.src = src;
      isImageLoaded = true;
      instructionsEl.classList.add('hidden');
      statusEl.textContent = '모션 활성';
      statusEl.classList.add('active');
      
      if (isMobile() && typeof DeviceOrientationEvent !== 'undefined') {
        requestMotionPermission();
      } else {
        startMotion();
      }
    }

    // ========================================
    // MOTION
    // ========================================
    
    function handleMotionButton() {
      if (isMobile() && typeof DeviceOrientationEvent !== 'undefined') {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          requestMotionPermission();
        } else {
          startMotion();
        }
      } else {
        startMotion();
      }
    }
    
    async function requestMotionPermission() {
      try {
        const perm = await DeviceOrientationEvent.requestPermission();
        if (perm === 'granted') startMotion();
        else {
          statusEl.textContent = '권한 거부됨';
          alert('모션 센서 권한이 필요합니다.');
        }
      } catch (err) {
        startMotion();
      }
    }
    
    function startMotion() {
      if (isMobile()) {
        window.addEventListener('deviceorientation', handleOrientation, { passive: true });
      }
      
      isMotionActive = true;
      card.classList.add('motion-active');
      statusEl.textContent = '모션 활성';
      statusEl.classList.add('active');
      motionBtn.textContent = '모션 활성됨';
      motionBtn.disabled = true;
      recalibrateBtn.style.display = 'block';
      
      console.log('Motion started');
    }
    
    // ONLY update target values - NO DOM changes here
    function handleOrientation(e) {
      const gamma = e.gamma || 0;
      const beta = e.beta || 0;
      
      if (!isRecalibrated) {
        centerGamma = gamma;
        centerBeta = beta;
        isRecalibrated = true;
      }
      
      const relGamma = gamma - centerGamma;
      const relBeta = beta - centerBeta;
      
      targetX = clamp(applyDeadZone(relGamma / SETTINGS.sensorRange), -1, 1);
      targetY = clamp(applyDeadZone(relBeta / SETTINGS.sensorRange), -1, 1);
      
      needsUpdate = true;
    }
    
    function handlePointerMove(e) {
      if (!isRecalibrated) {
        isRecalibrated = true;
      }
      
      const x = ((e.clientX / window.innerWidth) - 0.5) * 2;
      const y = ((e.clientY / window.innerHeight) - 0.5) * 2;
      
      targetX = clamp(applyDeadZone(x), -1, 1);
      targetY = clamp(applyDeadZone(y), -1, 1);
      
      needsUpdate = true;
    }
    
    function resetCenter() {
      if (!isMotionActive) return;
      isRecalibrated = false;
      centerGamma = 0;
      centerBeta = 0;
      targetX = 0;
      targetY = 0;
      statusEl.textContent = '재보정 완료';
      setTimeout(() => { statusEl.textContent = '모션 활성'; }, 1000);
    }
    
    function cyclePreset() {
      currentPresetIndex = (currentPresetIndex + 1) % presets.length;
      const preset = presets[currentPresetIndex];
      if (preset === 'default') card.removeAttribute('data-preset');
      else card.setAttribute('data-preset', preset);
      statusEl.textContent = `프리셋: ${preset}`;
      setTimeout(() => { statusEl.textContent = '모션 활성'; }, 1000);
    }

    // ========================================
    // SINGLE ANIMATION LOOP
    // Only transforms + opacity change
    // ========================================
    
    function animate() {
      // Smooth interpolation
      currentX += (targetX - currentX) * SETTINGS.smoothing;
      currentY += (targetY - currentY) * SETTINGS.smoothing;
      
      // Skip if no significant change
      if (Math.abs(currentX - lastRenderX) < EPSILON && 
          Math.abs(currentY - lastRenderY) < EPSILON) {
        requestAnimationFrame(animate);
        return;
      }
      
      lastRenderX = currentX;
      lastRenderY = currentY;
      
      // Update DOM - ONLY transform + opacity
      updateCard();
      
      requestAnimationFrame(animate);
    }
    
    function updateCard() {
      const root = document.documentElement;
      
      // Card rotation
      const rotateY = currentX * SETTINGS.maxRotateY;
      const rotateX = currentY * -SETTINGS.maxRotateX;
      
      // Layer positions
      const holoX = currentX * SETTINGS.holoDirX * SETTINGS.holoRange;
      const holoY = currentY * SETTINGS.holoDirY * SETTINGS.holoRange;
      
      const glareX = currentX * SETTINGS.glareDirX * SETTINGS.glareRange;
      const glareY = currentY * SETTINGS.glareDirY * SETTINGS.glareRange;
      
      const sparkleX = currentX * SETTINGS.sparkleDirX * SETTINGS.sparkleRange;
      const sparkleY = currentY * SETTINGS.sparkleDirY * SETTINGS.sparkleRange;
      
      // Calculate intensity for opacity
      const intensity = Math.sqrt(currentX * currentX + currentY * currentY);
      const holoOpacity = 0.2 + intensity * 0.4;
      const glareOpacity = 0.1 + intensity * 0.35;
      const sparkleOpacity = 0.05 + intensity * 0.2;
      
      // Apply ONLY these CSS properties per frame:
      // 1. --rotate-x, --rotate-y (transform)
      // 2. --holo-x, --holo-y (transform)
      // 3. --glare-x, --glare-y (transform)
      // 4. --sparkle-x, --sparkle-y (transform)
      // 5. --holo-opacity, --glare-opacity, --sparkle-opacity (opacity)
      
      root.style.setProperty('--rotate-x', `${rotateX}deg`);
      root.style.setProperty('--rotate-y', `${rotateY}deg`);
      root.style.setProperty('--holo-x', `${holoX}px`);
      root.style.setProperty('--holo-y', `${holoY}px`);
      root.style.setProperty('--glare-x', `${glareX}px`);
      root.style.setProperty('--glare-y', `${glareY}px`);
      root.style.setProperty('--sparkle-x', `${sparkleX}px`);
      root.style.setProperty('--sparkle-y', `${sparkleY}px`);
      root.style.setProperty('--holo-opacity', holoOpacity.toFixed(2));
      root.style.setProperty('--glare-opacity', glareOpacity.toFixed(2));
      root.style.setProperty('--sparkle-opacity', sparkleOpacity.toFixed(2));
      
      // Debug
      if (debugEl.style.display !== 'none') {
        dX.textContent = currentX.toFixed(2);
        dY.textContent = currentY.toFixed(2);
        dRx.textContent = `${rotateX.toFixed(1)}deg`;
        dRy.textContent = `${rotateY.toFixed(1)}deg`;
      }
    }

    // ========================================
    // UTILITIES
    // ========================================
    
    function isMobile() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    // ========================================
    // DEBUG TOGGLE
    // ========================================
    
    let tapCount = 0;
    let tapTimer = null;
    
    card?.addEventListener('click', () => {
      if (!isImageLoaded) return;
      tapCount++;
      clearTimeout(tapTimer);
      if (tapCount >= 5) {
        debugEl.style.display = debugEl.style.display === 'none' ? 'block' : 'none';
        tapCount = 0;
      } else {
        tapTimer = setTimeout(() => tapCount = 0, 1000);
      }
    });

    // ========================================
    // START
    // ========================================
    
    requestAnimationFrame(() => requestAnimationFrame(init));
  </script>
</body>
</html>
